    const rawContent = `🧠 RAJ SHAMANI × DR. SAHAR YOUSEF
Complete Learning Breakdown

1. THE BIG IDEA — "LEARN THE BIOLOGICAL LAWS OF YOUR BRAIN"

Most people think productivity means:

Work harder → work longer → achieve more.

Dr. Sahar challenges this.

Her idea is:

Understand your brain → work WITH it → achieve more with less wasted energy.

She says people can be extremely busy while still failing to achieve their goals because they're ignoring how motivation, focus, distraction and energy actually work.

Think about it like this:

Bad approach:
"I'll force myself to work 10 hours."

Better approach:
"How does my brain maintain attention? What destroys it? How do I protect it?"

That's a completely different mindset.

2. YOUR BRAIN IS NOT FIXED 🧠

One of the most important ideas in the interview is neuroplasticity.

Your brain isn't permanently locked into:
- your current attention span
- your current habits
- your current memory
- your current way of thinking
- your current level of discipline

The transcript emphasizes that the brain is dynamic and can change based on training, thoughts, feelings and habits.

Therefore:
What you repeatedly do → strengthens certain neural patterns.

So if you repeatedly:
📱 Scroll → scroll becomes easier
😰 Worry → worrying becomes easier
🏃 Exercise → exercising becomes easier
📚 Focus → focusing becomes easier

This is why your daily behavior matters so much.

3. THE MOST IMPORTANT DIFFERENCE: BELIEF

Raj asks what differentiates people who achieve extraordinary things.

Dr. Sahar's answer is essentially:
Belief.

She describes highly successful people as often having a belief that obstacles aren't permanent walls.

Average mindset:
"There's a wall. I can't."

High-agency mindset:
"There's a wall. Where's the door?"

The point isn't that you should believe anything magically becomes possible.

The useful lesson is:
Don't automatically interpret difficulty as impossibility.

Instead ask:
"What can I do about this?"

She specifically recommends redirecting the mind when it starts telling a victim-oriented story.

4. YOUR IDENTITY BECOMES A FILTER

This is one of the deepest lessons in the entire video.

Suppose you repeatedly tell yourself:
"I'm bad at talking to people."

Your brain starts noticing evidence that supports that story.

Someone doesn't reply → "See, people don't like me."
Someone gives short answer → "See, I'm awkward."

But if your identity becomes:
"I'm becoming confident and better at communication."

You start noticing different evidence:
Someone talks to you → opportunity.
Someone gives feedback → learning.
Someone responds positively → evidence of progress.

The transcript explains this through the Default Mode Network (DMN), described in the conversation as the brain's "storyteller" and associated with autobiographical identity and self-narration.

5. THE DMN — YOUR BRAIN'S "STORYTELLER"

Dr. Sahar gives a useful mental model.

DEFINITION: Default Mode Network (DMN)
DMN = Story Studio. It asks: Who am I? What am I capable of? What happened to me? What's possible for me? What kind of person am I?

The problem is that you can carry old stories for years.

For example:
"I'm unlucky."
"People like me don't become successful."
"I'm not disciplined."
"I always procrastinate."
"I'm terrible at relationships."

The key question is:
Is this story helping me?

If not, you need to challenge and replace it.

The transcript explicitly suggests examining which stories you're carrying and whether they're helping you become healthier, happier and more capable of achieving your goals.

6. PRIMING — WHY YOUR MINDSET CHANGES WHAT YOU NOTICE

This is fascinating.

Imagine you're thinking:
"I want to improve my career."

Suddenly you start noticing:
- useful people
- ideas
- opportunities
- skills you need
- information related to your goal

Those things may have existed before. But you weren't paying attention to them.

That's the concept of priming discussed in the video.

The interview explains that repeatedly reviewing your desired story can influence what you attend to and what opportunities you notice.

Simple formula:
Belief → Attention → What you notice → Behavior → Results

So: Change the story → change what you look for.

7. BUT DON'T CONFUSE BELIEF WITH DELUSION ⚠️

WARNING: Don't Confuse Belief with Delusion
Belief isn't magic. Belief changes what you attempt, what you notice and how persistently you act.

For example:

Belief A: "I'm terrible at business."
→ avoid opportunities
→ don't learn
→ give up quickly

Belief B: "I'm not good at business YET, but I can learn."
→ study
→ experiment
→ seek feedback
→ continue

Same person. Different behavior.

8. THE 4-PART IDENTITY EXERCISE ✍️

This is one of the most actionable parts of the episode. Dr. Sahar builds an identity-based framework around Raj's sleep example.

Step 1 — Identity
Ask: "What kind of person do I want to become?"
Example: "I am the type of person who prioritizes my health because it improves my performance."

Step 2 — Data
What do you already know that supports this?
Example: "I know that better sleep improves my ability to function."

Step 3 — Benefit
What becomes possible?
Example: "I'll be more focused, energetic and effective."

Step 4 — Habit
Turn identity into behavior.
Example: "I am the type of person who protects enough time for sleep."

The interview demonstrates this progression from identity → facts → benefits → habit.

9. DON'T SET ONLY GOALS — CREATE "IF → THEN" PLANS

This is extremely useful.

Weak goal:
"I want to sleep earlier." (That's a wish.)

Better:
"When X happens, I will do Y."

For example:
WHEN: 11 PM alarm rings
THEN: laptop closes → phone away → brush teeth → pajamas → bed routine.

This is called an implementation intention in the interview. The conversation describes it as a situation-action plan, essentially an "if-then" structure.

10. MAKE THE HABIT RIDICULOUSLY SMALL

This is another major lesson.

Don't say: "From tomorrow I'll completely transform my life."
Instead: Make the starting action tiny.

Example from the interview:
Instead of: "I'll definitely sleep early."
Start with: "I'll brush my teeth at 11 PM."
Then: Brush teeth → Pajamas → Get ready → Bed.

The transcript specifically recommends making the behavior as easy and small as possible.

TIP: Small Habits Principle
Small action → repeated → neural pathway strengthens → behavior becomes easier.

11. WHY BAD HABITS ARE SO HARD TO BREAK

This is perhaps the best section of the interview. Dr. Sahar explains that many unwanted behaviors aren't really about the behavior itself.

For example, you think: "I crave Instagram."
But underneath it might be:
Stress → overwhelm → craving relief → Instagram → temporary distraction → guilt → more stress → Instagram again

So the actual problem isn't necessarily: "I love Instagram."
It may be: "I'm using Instagram to escape an uncomfortable emotional state."

The transcript describes this cycle through feelings such as overwhelm, stress, tiredness and shame.

12. THE HABIT LOOP 🔄

1. Emotion ("I'm overwhelmed.")
2. Craving ("I need relief.")
3. Behavior ("I'll scroll.")
4. Temporary relief ("Ahh, I don't have to think.")
5. Problem remains (The work is still there.)
6. Shame/guilt ("Why did I waste my time?")
7. More negative emotion
8. Scroll again

That's the loop. And every repetition strengthens the association.

13. THE SOLUTION: DON'T JUST REMOVE THE BAD HABIT

This is a huge insight.

If you say: "I will NEVER scroll again." — your brain still has the old pathway.

Instead: Replace the behavior.

Old: Stress → 📱 scrolling
New: Stress → ⏸️ cognitive pause → 60 sec breathing → choose what to do

The interview recommends a tiny replacement behavior, such as one minute of breathwork, to interrupt the automatic sequence.

14. THE "60-SECOND PATTERN INTERRUPT" ⏸️

This is something you can actually try.

When you catch yourself automatically reaching for your phone:
1. STOP.
2. Ask: "What am I feeling right now?"
3. Close your eyes for 60 seconds.
4. Take some slow breaths.

After 60 seconds: If you still genuinely want to scroll, you can choose to.

The purpose isn't punishment.
The purpose is: Create a gap between craving and action. That gap gives you back choice.

15. AWARENESS COMES BEFORE CONTROL

You cannot change a behavior you don't understand. So Dr. Sahar recommends:

- Step 1: Notice the behavior.
- Step 2: Identify the emotion.
- Step 3: Identify the trigger.
- Step 4: Pause.
- Step 5: Choose a replacement.

The transcript calls this self-knowledge and emphasizes understanding the behavior loop before trying to change it.

16. DON'T ASK "WHY AM I SO UNDISCIPLINED?"

Ask: "What happened immediately before I did this?"

For example: Scrolling at night

Ask: ✅ "What was I feeling before I opened Instagram?"

17. SCROLLING IS NOT NECESSARILY REST 📱

You feel tired. You think: "I'll take a 20-minute break and scroll."

- 😌 Close your eyes
- 🌬️ Breathe
- ☀️ Get some natural environment exposure

The goal is recovery, not another stream of information.

18. BOREDOM IS PRODUCTIVE

This is something people underestimate.

Raj asks: How do successful people get incredible ideas?

When you're constantly consuming (TikTok → Instagram → YouTube → WhatsApp → email → music → notifications...), your brain has almost no empty space.

19. THE PHONE PROBLEM IS BIGGER THAN NOTIFICATIONS

This is probably the most shocking experiment in the episode.

The discussion describes a study where participants performed cognitive tasks under different phone-placement conditions:
- In another room
- Put away in a pocket/bag
- Visible on the table

Even though the phone was turned off, performance was significantly worse when the phone remained visible.

Meaning: You don't necessarily have to use the phone for it to compete for attention. Its mere presence can become an attentional cue.

Put the phone somewhere you cannot see it.

❌ NOT: Face down beside laptop, under your notebook, or in your pocket while checking it.
✅ INSTEAD: Another room, drawer, bag away from workspace, or dedicated phone box.

Dr. Sahar creates a simplified "city" analogy for important brain networks involved in performance:

You can't tell your brain: "Don't notice distractions." The brain is designed to detect potentially important things.

    // Content Parser and Renderer
    function parseAndRenderMarkdown(text) {
      const container = document.getElementById('main-content');
      const lines = text.split('\n');
      let html = '';
      let inList = false;
      let listType = '';
      let inTable = false;
      let tableHeaderDone = false;

      function closeList() {
        if (inList) {
          html += listType === 'ul' ? '</ul>\n' : '</ol>\n';
          inList = false;
        }
      }

      function closeTable() {
        if (inTable) {
          html += '</tbody></table></div>\n';
          inTable = false;
          tableHeaderDone = false;
        }
      }

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        if (!line) {
          closeList();
          closeTable();
          continue;
        }

        // Table Detection
        if (line.startsWith('|') && line.endsWith('|')) {
          closeList();
          const cells = line.split('|').slice(1, -1).map(c => c.trim());
          if (!inTable) {
            inTable = true;
            html += '<div class="table-container"><table><thead><tr>';
            cells.forEach(c => html += `<th>${inlineFormat(c)}</th>`);
            html += '</tr></thead><tbody>';
          } else if (line.includes(':---') || line.includes('---')) {
            // separator line, ignore
            continue;
          } else {
            html += '<tr>';
            cells.forEach(c => html += `<td>${inlineFormat(c)}</td>`);
            html += '</tr>';
          }
          continue;
        } else {
          closeTable();
        }

        // Special Callout Boxes
        if (line.startsWith('IMPORTANT:') || line.startsWith('WARNING:') || line.startsWith('TIP:') || line.startsWith('DEFINITION:')) {
          closeList();
          let type = 'note';
          let title = 'IMPORTANT';
          if (line.startsWith('WARNING:')) { type = 'warning'; title = 'WARNING'; }
          if (line.startsWith('TIP:')) { type = 'tip'; title = 'TIP'; }
          if (line.startsWith('DEFINITION:')) { type = 'definition'; title = 'DEFINITION'; }

          const content = line.substring(line.indexOf(':') + 1).trim();
          html += `<div class="info-box box-${type}">
            <div class="box-title">${title}</div>
            <p>${inlineFormat(content)}</p>
          </div>`;
          continue;
        }

        // Main Title (H1)
        if (i === 0 && line.startsWith('🧠')) {
          html += `<h1 id="title">${inlineFormat(line)}</h1>`;
          continue;
        }

        // Headings
        if (line.match(/^\d+\.\s+[A-Z\s]/) || (line.startsWith('#') && !line.startsWith('##'))) {
          closeList();
          const cleanText = line.replace(/^#\s*/, '');
          const id = 'section-' + slugify(cleanText);
          html += `<h2 id="${id}">${inlineFormat(cleanText)}</h2>`;
          continue;
        }

        if (line.startsWith('##') || line.match(/^Step \d+/i) || line.startsWith('EVERY MORNING') || line.startsWith('DURING DEEP WORK') || line.startsWith('WHEN YOU FEEL')) {
          closeList();
          const cleanText = line.replace(/^##\s*/, '');
          const id = 'subsection-' + slugify(cleanText);
          html += `<h3 id="${id}">${inlineFormat(cleanText)}</h3>`;
          continue;
        }

        // Bullet Lists
        if (line.startsWith('- ') || line.startsWith('• ')) {
          if (!inList || listType !== 'ul') {
            closeList();
            inList = true;
            listType = 'ul';
            html += '<ul>\n';
          }
          html += `<li>${inlineFormat(line.substring(2))}</li>\n`;
          continue;
        }

        // Numbered Lists
        const numMatch = line.match(/^(\d+)\.\s+(.*)/);
        if (numMatch && !line.match(/^\d+\.\s+[A-Z\s]{4,}/)) { // exclude main numbered titles
          if (!inList || listType !== 'ol') {
            closeList();
            inList = true;
            listType = 'ol';
            html += '<ol>\n';
          }
          html += `<li>${inlineFormat(numMatch[2])}</li>\n`;
          continue;
        }

        // Regular Paragraph
        closeList();
        html += `<p>${inlineFormat(line)}</p>\n`;
      }

      closeList();
      closeTable();

      container.innerHTML = html;
    }

    function inlineFormat(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function slugify(text) {
      return text.toLowerCase().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').substring(0, 50);
    }

    // TOC Generator
    function generateTOC() {
      const headings = document.querySelectorAll('.content h2, .content h3');
      const tocList = document.getElementById('toc-list');
      tocList.innerHTML = '';

      headings.forEach((heading) => {
        const li = document.createElement('li');
        li.className = 'toc-item';

        const a = document.createElement('a');
        a.href = `#${heading.id}`;
        a.className = `toc-link level-${heading.tagName.toLowerCase()}`;
        a.textContent = heading.textContent.replace(/^[\d\.\s\🎯\🧠]+/, '').trim();
        
        a.addEventListener('click', (e) => {
          e.preventDefault();
          heading.scrollIntoView({ behavior: 'smooth' });
          closeMobileSidebar();
        });

        li.appendChild(a);
        tocList.appendChild(li);
      });
    }

    // Calculate Reading Time
    function calculateReadingTime() {
      const text = document.getElementById('main-content').textContent;
      const wordCount = text.trim().split(/\s+/).length;
      const readTime = Math.ceil(wordCount / 200);
      document.getElementById('read-time').textContent = `⏱️ ${readTime} min read (${wordCount} words)`;
    }

    // Search Engine
    let currentMatchIndex = -1;
    let totalMatches = 0;

    function setupSearch() {
      const searchInput = document.getElementById('search-input');
      const searchStats = document.getElementById('search-stats');

      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.trim();
        clearHighlights();

        if (!query) {
          searchStats.textContent = '';
          return;
        }

        performSearch(query);
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        }
        if (e.key === 'Escape') {
          if (document.activeElement === searchInput) {
            searchInput.blur();
          }
          closeMobileSidebar();
        }
      });
    }

    function clearHighlights() {
      const highlights = document.querySelectorAll('mark.search-highlight');
      highlights.forEach(mark => {
        const parent = mark.parentNode;
        parent.replaceChild(document.createTextNode(mark.textContent), mark);
        parent.normalize();
      });
    }

    function performSearch(query) {
      const content = document.getElementById('main-content');
      const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
      
      let matchCount = 0;

      function highlightNode(node) {
        if (node.nodeType === 3) { // Text node
          const matches = node.data.match(regex);
          if (matches) {
            const fragment = document.createDocumentFragment();
            let lastIdx = 0;
            node.data.replace(regex, (match, p1, offset) => {
              fragment.appendChild(document.createTextNode(node.data.substring(lastIdx, offset)));
              const mark = document.createElement('mark');
              mark.className = 'search-highlight';
              mark.textContent = match;
              fragment.appendChild(mark);
              lastIdx = offset + match.length;
              matchCount++;
            });
            fragment.appendChild(document.createTextNode(node.data.substring(lastIdx)));
            node.parentNode.replaceChild(fragment, node);
          }
        } else if (node.nodeType === 1 && !['SCRIPT', 'STYLE', 'MARK'].includes(node.tagName)) {
          Array.from(node.childNodes).forEach(highlightNode);
        }
      }

      highlightNode(content);

      const searchStats = document.getElementById('search-stats');
      searchStats.textContent = matchCount > 0 ? `${matchCount} matches` : 'No matches';
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Scroll Progress & Active Heading Indicator
    function setupScrollHandling() {
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      const backToTop = document.getElementById('back-to-top');

      window.addEventListener('scroll', () => {
        const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
        const progress = Math.min(Math.max((window.scrollY / totalHeight) * 100, 0), 100);
        
        progressBar.style.width = `${progress}%`;
        progressText.textContent = `📊 Progress: ${Math.round(progress)}%`;

        if (window.scrollY > 400) {
          backToTop.classList.add('visible');
        } else {
          backToTop.classList.remove('visible');
        }

        updateActiveTOC();
        saveReadingPosition();
      });

      backToTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    function updateActiveTOC() {
      const headings = Array.from(document.querySelectorAll('.content h2, .content h3'));
      const scrollPos = window.scrollY + 100;

      let currentHeading = null;
      for (let i = headings.length - 1; i >= 0; i--) {
        if (headings[i].offsetTop <= scrollPos) {
          currentHeading = headings[i];
          break;
        }
      }

      const links = document.querySelectorAll('.toc-link');
      links.forEach(link => link.classList.remove('active'));

      if (currentHeading) {
        const activeLink = document.querySelector(`.toc-link[href="#${currentHeading.id}"]`);
        if (activeLink) {
          activeLink.classList.add('active');
        }
      }
    }

    // Font Size Control
    let currentFontSize = parseInt(localStorage.getItem('preferred-font-size')) || 16;

    function setupFontControls() {
      applyFontSize(currentFontSize);

      document.getElementById('font-increase').addEventListener('click', () => {
        if (currentFontSize < 24) {
          currentFontSize += 1;
          applyFontSize(currentFontSize);
        }
      });

      document.getElementById('font-decrease').addEventListener('click', () => {
        if (currentFontSize > 12) {
          currentFontSize -= 1;
          applyFontSize(currentFontSize);
        }
      });

      document.getElementById('font-reset').addEventListener('click', () => {
        currentFontSize = 16;
        applyFontSize(currentFontSize);
      });
    }

    function applyFontSize(size) {
      document.documentElement.style.setProperty('--base-font-size', `${size}px`);
      localStorage.setItem('preferred-font-size', size);
    }

    // Dark Mode Toggle
    function setupThemeToggle() {
      const themeToggle = document.getElementById('theme-toggle');
      const savedTheme = localStorage.getItem('preferred-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

      if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.textContent = '☀️';
      }

      themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if (currentTheme === 'dark') {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('preferred-theme', 'light');
          themeToggle.textContent = '🌙';
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('preferred-theme', 'dark');
          themeToggle.textContent = '☀️';
        }
      });
    }

    // Print Button
    function setupPrint() {
      document.getElementById('print-btn').addEventListener('click', () => {
        window.print();
      });
    }

    // Mobile Sidebar
    function setupMobileSidebar() {
      const toggleBtn = document.getElementById('toggle-sidebar');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');

      toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
      });

      overlay.addEventListener('click', closeMobileSidebar);
    }

    function closeMobileSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('open');
    }

    // Save/Restore Reading Position
    function saveReadingPosition() {
      localStorage.setItem('scroll-position', window.scrollY);
    }

    function restoreReadingPosition() {
      const savedPos = localStorage.getItem('scroll-position');
      if (savedPos && !window.location.hash) {
        window.scrollTo(0, parseInt(savedPos));
      }
    }

    // Initialization
    window.addEventListener('DOMContentLoaded', () => {
      parseAndRenderMarkdown(rawContent);
      generateTOC();
      calculateReadingTime();
      setupSearch();
      setupScrollHandling();
      setupFontControls();
      setupThemeToggle();
      setupPrint();
      setupMobileSidebar();
      restoreReadingPosition();
    });
  </script>
