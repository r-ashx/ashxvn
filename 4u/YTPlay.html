<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Player by Ax!</title>
    <style>
        :root {
            --bg-main: #050505;
            --bg-card: #18181b;
            --bg-card-secondary: #27272a;
            --text-main: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-red: #ff0033;
            --accent-red-hover: #e6002e;
            --error-color: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.1);
            --border-color: #3f3f46;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --shadow-subtle: 0 10px 30px rgba(0, 0, 0, 0.5);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 16px;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header.app-header {
            text-align: center;
            margin-bottom: 8px;
        }

        header.app-header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        header.app-header h1 svg {
            fill: var(--accent-red);
            width: 36px;
            height: 36px;
        }

        header.app-header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-subtle);
            transition: var(--transition-smooth);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (min-width: 640px) {
            .input-group {
                flex-direction: row;
            }
        }

        .input-wrapper {
            position: relative;
            flex: 1;
        }

        .input-wrapper input {
            width: 100%;
            background-color: var(--bg-card-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            padding: 14px 16px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition-smooth);
        }

        .input-wrapper input:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 0 3px rgba(255, 0, 51, 0.15);
        }

        .input-wrapper input::placeholder {
            color: var(--text-secondary);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: var(--radius-md);
            padding: 0 20px;
            height: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            transition: var(--transition-smooth);
            white-space: nowrap;
        }

        button.btn-primary {
            background-color: var(--accent-red);
            color: white;
            flex: 1;
        }

        @media (min-width: 640px) {
            button.btn-primary {
                flex: initial;
            }
        }

        button.btn-primary:hover {
            background-color: var(--accent-red-hover);
            transform: translateY(-1px);
        }

        button.btn-primary:active {
            transform: translateY(0);
        }

        button.btn-secondary {
            background-color: var(--bg-card-secondary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        button.btn-secondary:hover {
            background-color: var(--border-color);
        }

        .hint-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .player-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-subtle);
            border: 1px solid var(--border-color);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Normal Video Mode: 16:9, Max 900px */
        .player-wrapper.mode-normal {
            max-width: 900px;
            aspect-ratio: 16 / 9;
        }

        /* Shorts Mode: 9:16, Max 400px, centered */
        .player-wrapper.mode-shorts {
            max-width: 400px;
            aspect-ratio: 9 / 16;
            margin: 0 auto;
        }

        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .loader-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(5, 5, 5, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .loader-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .error-panel {
            background-color: var(--error-bg);
            border: 1px solid var(--error-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 16px;
            animation: fadeIn 0.3s ease;
        }

        .error-panel.visible {
            display: flex;
        }

        .error-icon {
            font-size: 2.5rem;
            line-height: 1;
        }

        .error-message {
            color: #fca5a5;
            font-size: 1rem;
            max-width: 500px;
            line-height: 1.5;
        }

        .error-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .history-section {
            margin-top: 12px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .clear-history-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
        }

        .clear-history-btn:hover {
            color: var(--text-main);
            background-color: var(--bg-card-secondary);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            background-color: var(--bg-card-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: var(--transition-smooth);
        }

        .history-item:hover {
            border-color: var(--text-secondary);
        }

        .history-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            flex: 1;
        }

        .history-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: var(--radius-sm);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-normal {
            background-color: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        .badge-shorts {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .history-url {
            font-size: 0.9rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-actions {
            display: flex;
            gap: 8px;
        }

        .history-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .history-btn:hover {
            background-color: var(--border-color);
        }

        .history-btn.delete:hover {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: var(--error-color);
            color: #fca5a5;
        }

        .empty-history {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
            background-color: var(--bg-card-secondary);
            border-radius: var(--radius-md);
            border: 1px dashed var(--border-color);
        }

        /* Utility classes */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <h1>
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
                YouTube Player
            </h1>
            <!-- <p>Paste a YouTube video or Shorts link to start watching seamlessly</p> -->
        </header>

        <div class="card">
            <div class="input-group">
                <div class="input-wrapper">
                    <label for="urlInput" class="hidden">YouTube URL</label>
                    <input type="text" id="urlInput" placeholder="Paste YouTube video or Shorts link (e.g. youtu.be/...)" autocomplete="off" spellcheck="false">
                </div>
                <div class="button-group">
                    <button id="playBtn" class="btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Play
                    </button>
                    <button id="clearBtn" class="btn-secondary" title="Clear player and input">Clear</button>
                </div>
            </div>
            <div class="hint-text">
                <span>Supports: youtube.com/watch?v=, youtu.be/, /shorts/ & embed links</span>
                <span id="videoTypeIndicator" style="font-weight: 500; color: var(--text-main);">Ready</span>
            </div>
        </div>

        <div class="player-section">
            <div id="playerWrapper" class="player-wrapper mode-normal">
                <div id="loaderOverlay" class="loader-overlay">
                    <div class="spinner"></div>
                    <div class="loader-text">Loading video...</div>
                </div>
                <!-- Default empty or placeholder state -->
                <div id="playerPlaceholder" style="color: var(--text-secondary); text-align: center; padding: 40px; font-size: 0.95rem;">
                    Your video player will appear here
                </div>
                <iframe id="youtubeIframe" class="hidden" src="" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>

            <div id="errorPanel" class="error-panel">
                <div class="error-icon">⚠️</div>
                <div id="errorMessage" class="error-message">Please enter a valid YouTube video or Shorts URL.</div>
                <div class="error-actions">
                    <button id="retryBtn" class="btn-secondary">Try Again</button>
                    <button id="openYoutubeBtn" class="btn-primary">Open on YouTube</button>
                </div>
            </div>
        </div>

        <div class="card history-section">
            <div class="history-header">
                <h3>Recent Videos</h3>
                <button id="clearHistoryBtn" class="clear-history-btn">Clear History</button>
            </div>
            <div id="historyListContainer" class="history-list">
                <!-- Dynamically populated history items -->
            </div>
        </div>
    </div>

    <script>
        // State management variables
        let currentVideoData = null;
        let iframeLoadTimeout = null;

        // DOM elements
        const urlInput = document.getElementById('urlInput');
        const playBtn = document.getElementById('playBtn');
        const clearBtn = document.getElementById('clearBtn');
        const retryBtn = document.getElementById('retryBtn');
        const openYoutubeBtn = document.getElementById('openYoutubeBtn');
        const playerWrapper = document.getElementById('playerWrapper');
        const youtubeIframe = document.getElementById('youtubeIframe');
        const loaderOverlay = document.getElementById('loaderOverlay');
        const playerPlaceholder = document.getElementById('playerPlaceholder');
        const errorPanel = document.getElementById('errorPanel');
        const errorMessage = document.getElementById('errorMessage');
        const videoTypeIndicator = document.getElementById('videoTypeIndicator');
        const historyListContainer = document.getElementById('historyListContainer');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        function extractYouTubeVideo(url) {
            if (!url || typeof url !== 'string') return null;
            const trimmedUrl = url.trim();
            if (!trimmedUrl) return null;

            let parsedUrl;
            try {
                // If URL doesn't have protocol, try prepending https://
                let testUrl = trimmedUrl;
                if (!testUrl.startsWith('http://') && !testUrl.startsWith('https://')) {
                    testUrl = 'https://' + testUrl;
                }
                parsedUrl = new URL(testUrl);
            } catch (e) {
                return null;
            }

            const hostname = parsedUrl.hostname.toLowerCase();
            const validHostnames = ['youtube.com', 'www.youtube.com', 'm.youtube.com', 'youtu.be', 'youtube-nocookie.com', 'www.youtube-nocookie.com'];
            
            // Check if hostname matches allowed YouTube domains
            const isValidHost = validHostnames.some(h => hostname === h || hostname.endsWith('.' + h));
            if (!isValidHost) return null;

            let videoId = null;
            let isShort = false;

            // Handle youtu.be/VIDEO_ID
            if (hostname === 'youtu.be' || hostname.endsWith('.youtu.be')) {
                const pathSegments = parsedUrl.pathname.split('/').filter(Boolean);
                if (pathSegments.length > 0) {
                    videoId = pathSegments[0];
                }
            } 
            // Handle youtube.com variants
            else {
                const pathname = parsedUrl.pathname;
                
                // Handle /shorts/VIDEO_ID
                if (pathname.startsWith('/shorts/')) {
                    const pathSegments = pathname.split('/').filter(Boolean);
                    if (pathSegments.length >= 2) {
                        videoId = pathSegments[1];
                        isShort = true;
                    }
                } 
                // Handle /embed/VIDEO_ID
                else if (pathname.startsWith('/embed/')) {
                    const pathSegments = pathname.split('/').filter(Boolean);
                    if (pathSegments.length >= 2) {
                        videoId = pathSegments[1];
                    }
                } 
                // Handle /watch?v=VIDEO_ID or similar query paths
                else if (parsedUrl.searchParams.has('v')) {
                    videoId = parsedUrl.searchParams.get('v');
                }
                // Handle /v/VIDEO_ID or other standard embed structures
                else {
                    const pathSegments = pathname.split('/').filter(Boolean);
                    if (pathSegments.length >= 2 && (pathSegments[0] === 'v' || pathSegments[0] === 'e')) {
                        videoId = pathSegments[1];
                    }
                }
            }

            // Validate standard YouTube video ID format (typically 11 characters alphanumeric + underscores/hyphens)
            if (!videoId || typeof videoId !== 'string' || videoId.length < 5 || videoId.length > 20) {
                return null;
            }

            // Clean up ID from trailing query fragments if any
            videoId = videoId.split('?')[0].split('&')[0].split('#')[0];

            return {
                id: videoId,
                isShort: isShort,
                originalUrl: trimmedUrl
            };
        }

        function setLoading(isLoading) {
            if (isLoading) {
                loaderOverlay.classList.add('active');
            } else {
                loaderOverlay.classList.remove('active');
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorPanel.classList.add('visible');
            setLoading(false);
        }

        function hideError() {
            errorPanel.classList.remove('visible');
        }

        function clearPlayer() {
            urlInput.value = '';
            youtubeIframe.src = '';
            youtubeIframe.classList.add('hidden');
            playerPlaceholder.classList.remove('hidden');
            playerWrapper.className = 'player-wrapper mode-normal';
            videoTypeIndicator.textContent = 'Ready';
            videoTypeIndicator.style.color = 'var(--text-main)';
            currentVideoData = null;
            hideError();
            setLoading(false);
            if (iframeLoadTimeout) clearTimeout(iframeLoadTimeout);
        }

        function loadVideo(videoData, isRetry = false) {
            if (!videoData || !videoData.id) {
                showError('Please enter a valid YouTube video or Shorts URL.');
                return;
            }

            hideError();
            currentVideoData = videoData;
            setLoading(true);

            // Update player mode container layout
            playerWrapper.className = 'player-wrapper ' + (videoData.isShort ? 'mode-shorts' : 'mode-normal');
            videoTypeIndicator.textContent = videoData.isShort ? 'Shorts Mode (9:16)' : 'Normal Mode (16:9)';
            videoTypeIndicator.style.color = videoData.isShort ? '#f87171' : '#60a5fa';

            playerPlaceholder.classList.add('hidden');
            youtubeIframe.classList.remove('hidden');

            // Construct official YouTube iframe source safely with encodeURIComponent
            const safeVideoId = encodeURIComponent(videoData.id);
            const embedUrl = `https://www.youtube.com/embed/${safeVideoId}?autoplay=1&rel=0`;
            
            youtubeIframe.src = embedUrl;

            // Handle load state simulation / iframe load event
            if (iframeLoadTimeout) clearTimeout(iframeLoadTimeout);
            
            // Failsafe timeout to hide loader if load event takes too long or fails silently
            iframeLoadTimeout = setTimeout(() => {
                setLoading(false);
            }, 1200);

            // Save to recent history storage
            saveToHistory(videoData);
        }

        // Iframe load completion listener
        youtubeIframe.addEventListener('load', () => {
            // Keep loader active for a brief moment to ensure smooth rendering transition
            setTimeout(() => {
                setLoading(false);
            }, 300);
        });

        function getHistory() {
            try {
                const history = localStorage.getItem('yt_player_history');
                return history ? JSON.parse(history) : [];
            } catch (e) {
                return [];
            }
        }

        function saveToHistory(videoData) {
            try {
                let history = getHistory();
                // Remove duplicate entry if exists
                history = history.filter(item => item.id !== videoData.id);
                // Add to beginning
                history.unshift(videoData);
                // Keep max 5 items
                if (history.length > 5) {
                    history = history.slice(0, 5);
                }
                localStorage.setItem('yt_player_history', JSON.stringify(history));
                renderHistory();
            } catch (e) {
                // Ignore storage quota errors or restricted storage environments
            }
        }

        function removeFromHistory(videoId) {
            try {
                let history = getHistory();
                history = history.filter(item => item.id !== videoId);
                localStorage.setItem('yt_player_history', JSON.stringify(history));
                renderHistory();
            } catch (e) {}
        }

        function renderHistory() {
            const history = getHistory();
            historyListContainer.innerHTML = '';

            if (history.length === 0) {
                const emptyEl = document.createElement('div');
                emptyEl.className = 'empty-history';
                emptyEl.textContent = 'No recent videos yet. Play a video to see it here.';
                historyListContainer.appendChild(emptyEl);
                return;
            }

            history.forEach(item => {
                const itemEl = document.createElement('div');
                itemEl.className = 'history-item';

                const infoEl = document.createElement('div');
                infoEl.className = 'history-info';

                const badgeEl = document.createElement('span');
                badgeEl.className = `history-badge ${item.isShort ? 'badge-shorts' : 'badge-normal'}`;
                badgeEl.textContent = item.isShort ? 'Short' : 'Video';

                const urlEl = document.createElement('span');
                urlEl.className = 'history-url';
                urlEl.textContent = item.originalUrl;
                urlEl.title = item.originalUrl;

                infoEl.appendChild(badgeEl);
                infoEl.appendChild(urlEl);

                const actionsEl = document.createElement('div');
                actionsEl.className = 'history-actions';

                const playItemBtn = document.createElement('button');
                playItemBtn.className = 'history-btn';
                playItemBtn.textContent = 'Play';
                playItemBtn.addEventListener('click', () => {
                    urlInput.value = item.originalUrl;
                    loadVideo(item);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });

                const deleteItemBtn = document.createElement('button');
                deleteItemBtn.className = 'history-btn delete';
                deleteItemBtn.textContent = 'Delete';
                deleteItemBtn.addEventListener('click', () => {
                    removeFromHistory(item.id);
                });

                actionsEl.appendChild(playItemBtn);
                actionsEl.appendChild(deleteItemBtn);

                itemEl.appendChild(infoEl);
                itemEl.appendChild(actionsEl);

                historyListContainer.appendChild(itemEl);
            });
        }

        function handlePlayAction() {
            const rawUrl = urlInput.value;
            if (!rawUrl.trim()) {
                showError('Please enter a YouTube video or Shorts URL.');
                return;
            }

            const videoData = extractYouTubeVideo(rawUrl);
            if (!videoData) {
                showError('Please enter a valid YouTube video or Shorts URL (e.g. https://www.youtube.com/watch?v=...).');
                return;
            }

            loadVideo(videoData);
        }

        playBtn.addEventListener('click', handlePlayAction);

        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handlePlayAction();
            }
        });

        clearBtn.addEventListener('click', clearPlayer);

        retryBtn.addEventListener('click', () => {
            if (currentVideoData) {
                loadVideo(currentVideoData, true);
            } else {
                handlePlayAction();
            }
        });

        openYoutubeBtn.addEventListener('click', () => {
            if (currentVideoData && currentVideoData.originalUrl) {
                window.open(currentVideoData.originalUrl, '_blank', 'noopener,noreferrer');
            } else if (urlInput.value.trim()) {
                window.open(urlInput.value.trim(), '_blank', 'noopener,noreferrer');
            }
        });

        clearHistoryBtn.addEventListener('click', () => {
            try {
                localStorage.removeItem('yt_player_history');
                renderHistory();
            } catch (e) {}
        });

        // Global keyboard shortcut: Escape to dismiss error or clear input if active
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideError();
            }
        });

        // Initialize history list on load
        document.addEventListener('DOMContentLoaded', () => {
            renderHistory();
        });
    </script>
</body>
</html>
