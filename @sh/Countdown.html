<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to 10 November 2026</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. RESET & VARIABLES
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #16a34a;
            --primary-light: #22c55e;
            --primary-dark: #15803d;
            --accent: #4ade80;
            --accent-glow: rgba(74, 222, 128, 0.4);
            --background: #f0fdf4;
            --white: #ffffff;
            --text: #14532d;
            --muted: #64748b;
            --border-light: rgba(22, 163, 74, 0.18);
            --shadow-subtle: 0 12px 35px -10px rgba(22, 163, 74, 0.14);
            --shadow-hover: 0 25px 45px -12px rgba(22, 163, 74, 0.28);
            --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --transition-base: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ==========================================================================
           2. BODY & AMBIENT ANIMATED BACKGROUND
           ========================================================================== */
        html {
            font-family: var(--font-family);
            background-color: var(--background);
            color: var(--text);
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 3rem 1.5rem;
        }

        /* Canvas Particle Mesh (Background Effect) */
        #bg-particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            pointer-events: none;
        }

        /* Vibrant Glowing Background Orbs */
        .bg-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            animation: pulseFloat 18s infinite ease-in-out alternate;
        }

        .blob-1 {
            top: -15%;
            left: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, #86efac 0%, #bbf7d0 70%, transparent 100%);
            animation-duration: 20s;
        }

        .blob-2 {
            bottom: -20%;
            right: -10%;
            width: 65vw;
            height: 65vw;
            background: radial-gradient(circle, #4ade80 0%, #dcfce7 70%, transparent 100%);
            animation-duration: 25s;
            animation-delay: -5s;
        }

        .blob-3 {
            top: 35%;
            left: 30%;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, #22c55e 0%, #a7f3d0 70%, transparent 100%);
            opacity: 0.35;
            animation-duration: 22s;
            animation-delay: -10s;
        }

        /* Floating Organic Decorative Elements */
        .floating-leaf {
            position: fixed;
            font-size: 1.5rem;
            opacity: 0.25;
            z-index: -1;
            pointer-events: none;
            animation: floatLeaf 14s infinite ease-in-out alternate;
        }
        .leaf-1 { top: 15%; left: 8%; animation-delay: 0s; }
        .leaf-2 { bottom: 20%; left: 12%; animation-delay: -4s; transform: rotate(45deg); }
        .leaf-3 { top: 25%; right: 10%; animation-delay: -7s; transform: rotate(-30deg); }
        .leaf-4 { bottom: 15%; right: 8%; animation-delay: -11s; transform: rotate(15deg); }

        /* Container Scaffold */
        .container {
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.25rem;
            position: relative;
            z-index: 1;
        }

        /* Entrance Animations */
        .anim-element {
            opacity: 0;
            transform: translateY(25px);
            animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.25s; }
        .delay-3 { animation-delay: 0.4s; }
        .delay-4 { animation-delay: 0.55s; }
        .delay-5 { animation-delay: 0.7s; }

        /* ==========================================================================
           3. HERO SECTION
           ========================================================================== */
        .hero {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.1rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.5rem 1.2rem;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--border-light);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--primary-dark);
            box-shadow: 0 4px 20px rgba(22, 163, 74, 0.12),
                        0 0 15px rgba(74, 222, 128, 0.2);
            animation: glowPulse 3s infinite alternate;
        }

        .badge-sparkle {
            color: var(--primary-light);
            font-size: 0.9rem;
            animation: spinSparkle 6s linear infinite;
        }

        .main-heading {
            font-size: clamp(2.35rem, 5.8vw, 3.6rem);
            font-weight: 800;
            letter-spacing: -0.035em;
            line-height: 1.15;
            background: linear-gradient(135deg, #14532d 0%, #16a34a 60%, #15803d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(22, 163, 74, 0.15);
        }

        .date-range {
            font-size: 0.95rem;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.02em;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.75);
            padding: 0.55rem 1.35rem;
            border-radius: 9999px;
            border: 1px solid var(--border-light);
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
        }

        .date-range .arrow {
            color: var(--primary);
            font-weight: 800;
        }

        /* ==========================================================================
           4. COUNTDOWN CARDS (3D TILT + GLOW EFFECTS)
           ========================================================================== */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.25rem;
            width: 100%;
            perspective: 1000px;
        }

        .card {
            background: rgba(255, 255, 255, 0.88);
            border: 1.5px solid rgba(34, 197, 94, 0.22);
            border-radius: 1.35rem;
            padding: 1.85rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow-subtle),
                        inset 0 1px 0 rgba(255, 255, 255, 0.9);
            transition: var(--transition-base);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: var(--transition-base);
        }

        .card:hover {
            transform: translateY(-8px) scale(1.025) rotateX(4deg);
            border-color: var(--primary-light);
            box-shadow: var(--shadow-hover),
                        0 0 25px rgba(74, 222, 128, 0.3);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-number-wrapper {
            height: 3.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-number {
            font-size: clamp(2.6rem, 4.6vw, 3.6rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
        }

        .card-number.num-animate {
            animation: numSlidePulse 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-seconds {
            border-color: rgba(34, 197, 94, 0.35);
        }

        .card-seconds .card-number {
            color: var(--primary-dark);
            text-shadow: 0 0 18px rgba(74, 222, 128, 0.45);
            animation: secPulse 1s infinite alternate ease-in-out;
        }

        .card-label {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 0.65rem;
        }

        /* ==========================================================================
           5. PROGRESS SECTION (CIRCULAR & HORIZONTAL BAR)
           ========================================================================== */
        .progress-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 100%;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid var(--border-light);
            border-radius: 1.6rem;
            padding: 2.25rem 2rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow-subtle);
            position: relative;
        }

        /* SVG Circular Progress Ring */
        .circle-container {
            position: relative;
            width: 145px;
            height: 145px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circle-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: rgba(22, 163, 74, 0.08);
            stroke-width: 9;
        }

        .circle-progress {
            fill: none;
            stroke: url(#green-gradient);
            stroke-width: 9;
            stroke-dasharray: 364.42;
            stroke-dashoffset: 364.42;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s ease-in-out;
            filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.45));
        }

        .circle-content {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .circle-percentage {
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--text);
            line-height: 1;
        }

        .circle-label {
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--primary-dark);
            margin-top: 0.35rem;
        }

        /* Horizontal Progress Bar */
        .bar-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .bar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .bar-title {
            color: var(--muted);
        }

        .bar-value {
            color: var(--primary);
        }

        .bar-track {
            width: 100%;
            height: 12px;
            background: rgba(22, 163, 74, 0.08);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(22, 163, 74, 0.12);
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 9999px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light), var(--accent));
            box-shadow: 0 0 16px rgba(34, 197, 94, 0.5);
            transition: width 1s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        /* Animated Sweep Shine on Progress Bar */
        .bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
            animation: shineSweep 2.2s infinite;
        }

        /* ==========================================================================
           6. DATE CARDS & MOTIVATIONAL MESSAGE
           ========================================================================== */
        .date-cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            width: 100%;
        }

        .date-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--border-light);
            border-radius: 1.2rem;
            padding: 1.35rem 1.6rem;
            display: flex;
            align-items: center;
            gap: 1.1rem;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: var(--shadow-subtle);
            transition: var(--transition-base);
        }

        .date-card:hover {
            border-color: var(--primary-light);
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 15px 30px -10px rgba(22, 163, 74, 0.2);
        }

        .date-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(22, 163, 74, 0.1);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            flex-shrink: 0;
            box-shadow: inset 0 0 10px rgba(22, 163, 74, 0.1);
        }

        .date-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .date-card-label {
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .date-card-value {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
        }

        .motivational-box {
            text-align: center;
            padding: 0.95rem 2rem;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--border-light);
            color: var(--primary-dark);
            font-size: 0.95rem;
            font-weight: 700;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-subtle),
                        0 0 20px rgba(74, 222, 128, 0.15);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* ==========================================================================
           7. COMPLETION CELEBRATION
           ========================================================================== */
        .completion-message {
            display: none;
            font-size: clamp(1.85rem, 4.5vw, 2.75rem);
            font-weight: 800;
            color: var(--primary);
            text-align: center;
            text-shadow: 0 0 25px rgba(34, 197, 94, 0.4);
            animation: pulseGlow 2s infinite alternate;
        }

        #celebration-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
            display: none;
        }

        /* ==========================================================================
           8. ANIMATIONS & KEYFRAMES
           ========================================================================== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(4%, 6%) scale(1.06);
            }
            100% {
                transform: translate(-3%, -4%) scale(0.94);
            }
        }

        @keyframes floatLeaf {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(15deg); }
            100% { transform: translateY(10px) rotate(-10deg); }
        }

        @keyframes glowPulse {
            0% { box-shadow: 0 4px 20px rgba(22, 163, 74, 0.12), 0 0 10px rgba(74, 222, 128, 0.15); }
            100% { box-shadow: 0 4px 20px rgba(22, 163, 74, 0.2), 0 0 25px rgba(74, 222, 128, 0.4); }
        }

        @keyframes spinSparkle {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes numSlidePulse {
            0% {
                transform: translateY(-12px) scale(0.9);
                opacity: 0.1;
            }
            50% {
                transform: translateY(2px) scale(1.05);
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes secPulse {
            0% { opacity: 0.9; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        @keyframes shineSweep {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        @keyframes pulseGlow {
            from { transform: scale(1); opacity: 0.9; }
            to { transform: scale(1.05); opacity: 1; }
        }

        /* ==========================================================================
           9. RESPONSIVE DESIGN & ACCESSIBILITY
           ========================================================================== */
        @media (max-width: 640px) {
            body {
                padding: 2rem 1rem;
            }

            .container {
                gap: 1.75rem;
            }

            .countdown-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.85rem;
            }

            .card {
                padding: 1.35rem 0.75rem;
            }

            .card-number-wrapper {
                height: 3rem;
            }

            .date-cards-grid {
                grid-template-columns: 1fr;
                gap: 0.85rem;
            }

            .progress-section {
                padding: 1.75rem 1.25rem;
                gap: 1.5rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .blob,
            .floating-leaf,
            .badge-sparkle,
            .card-number.num-animate,
            .bar-fill::after,
            .completion-message,
            .anim-element {
                animation: none !important;
                transition: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
            
            .card:hover {
                transform: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Canvas Particle Mesh Background -->
    <canvas id="bg-particles-canvas"></canvas>

    <!-- Animated Glowing Background Blobs -->
    <div class="bg-blobs" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Floating Organic Decorative Elements -->
    <div class="floating-leaf leaf-1" aria-hidden="true">🌿</div>
    <div class="floating-leaf leaf-2" aria-hidden="true">🌱</div>
    <div class="floating-leaf leaf-3" aria-hidden="true">✨</div>
    <div class="floating-leaf leaf-4" aria-hidden="true">🍃</div>

    <!-- Confetti Celebration Canvas -->
    <canvas id="celebration-canvas"></canvas>

    <!-- Main App Container -->
    <main class="container">
        
        <!-- Hero Section -->
        <header class="hero anim-element delay-1">
            <div class="badge">
                <span class="badge-sparkle" aria-hidden="true">✦</span>
                <span>COUNTDOWN TIMER</span>
            </div>
            <h1 class="main-heading">Countdown to 10 November</h1>
            <div class="date-range">
                <span>8 July 2026</span>
                <span class="arrow" aria-hidden="true">→</span>
                <span>10 November 2026</span>
            </div>
        </header>

        <!-- Countdown Display Grid -->
        <section aria-label="Countdown Timer" class="countdown-grid anim-element delay-2">
            <div class="card">
                <div class="card-number-wrapper">
                    <span id="days" class="card-number" aria-live="polite">00</span>
                </div>
                <span class="card-label">Days</span>
            </div>
            
            <div class="card">
                <div class="card-number-wrapper">
                    <span id="hours" class="card-number" aria-live="polite">00</span>
                </div>
                <span class="card-label">Hours</span>
            </div>

            <div class="card">
                <div class="card-number-wrapper">
                    <span id="minutes" class="card-number" aria-live="polite">00</span>
                </div>
                <span class="card-label">Minutes</span>
            </div>

            <div class="card card-seconds">
                <div class="card-number-wrapper">
                    <span id="seconds" class="card-number" aria-live="polite">00</span>
                </div>
                <span class="card-label">Seconds</span>
            </div>
        </section>

        <!-- Completion State Message -->
        <div id="completion-message" class="completion-message" role="status">
            🎉 Countdown Complete!
        </div>

        <!-- Progress Tracking Section -->
        <section aria-label="Time Progress Information" class="progress-section anim-element delay-3">
            
            <!-- SVG Circular Progress Indicator -->
            <div class="circle-container">
                <svg class="circle-svg" viewBox="0 0 130 130" aria-hidden="true">
                    <defs>
                        <linearGradient id="green-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="var(--primary)" />
                            <stop offset="50%" stop-color="var(--primary-light)" />
                            <stop offset="100%" stop-color="var(--accent)" />
                        </linearGradient>
                    </defs>
                    <circle class="circle-bg" cx="65" cy="65" r="58"></circle>
                    <circle id="circle-progress" class="circle-progress" cx="65" cy="65" r="58"></circle>
                </svg>
                <div class="circle-content">
                    <span id="circle-percentage" class="circle-percentage">0%</span>
                    <span class="circle-label">Completed</span>
                </div>
            </div>

            <!-- Horizontal Progress Bar -->
            <div class="bar-container">
                <div class="bar-header">
                    <span class="bar-title">Time Progress</span>
                    <span id="bar-value" class="bar-value">0% completed</span>
                </div>
                <div class="bar-track" role="progressbar" id="progress-bar-aria" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div id="bar-fill" class="bar-fill"></div>
                </div>
            </div>

        </section>

        <!-- Date Information Cards -->
        <section aria-label="Date Details" class="date-cards-grid anim-element delay-4">
            <div class="date-card">
                <div class="date-icon" aria-hidden="true">🌱</div>
                <div class="date-info">
                    <span class="date-card-label">Start Date</span>
                    <span class="date-card-value">8 July 2026</span>
                </div>
            </div>
            <div class="date-card">
                <div class="date-icon" aria-hidden="true">🎯</div>
                <div class="date-info">
                    <span class="date-card-label">End Date</span>
                    <span class="date-card-value">10 November 2026</span>
                </div>
            </div>
        </section>

        <!-- Dynamic Motivational Message -->
        <div id="motivational-message" class="motivational-box anim-element delay-5" role="status">
            Every second brings you closer.
        </div>

    </main>

    <!-- JavaScript Engine -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- CONSTANTS & CONFIGURATION ---
            const START_DATE = new Date(2026, 6, 8, 0, 0, 0).getTime(); // 8 July 2026
            const TARGET_DATE = new Date(2026, 10, 10, 23, 59, 59, 999).getTime(); // 10 Nov 2026
            const TOTAL_DURATION = TARGET_DATE - START_DATE;

            const CIRCLE_RADIUS = 58;
            const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * CIRCLE_RADIUS;

            // --- DOM CACHING ---
            const dom = {
                days: document.getElementById('days'),
                hours: document.getElementById('hours'),
                minutes: document.getElementById('minutes'),
                seconds: document.getElementById('seconds'),
                circleProgress: document.getElementById('circle-progress'),
                circlePercentage: document.getElementById('circle-percentage'),
                barFill: document.getElementById('bar-fill'),
                barValue: document.getElementById('bar-value'),
                progressBarAria: document.getElementById('progress-bar-aria'),
                motivationalMessage: document.getElementById('motivational-message'),
                completionMessage: document.getElementById('completion-message'),
                canvasConfetti: document.getElementById('celebration-canvas'),
                canvasBg: document.getElementById('bg-particles-canvas')
            };

            const prevValues = { days: null, hours: null, minutes: null, seconds: null, msg: '' };
            const pad = (num) => String(num).padStart(2, '0');

            // --- AMBIENT BACKGROUND CANVAS PARTICLES ---
            (function initBgParticles() {
                const ctx = dom.canvasBg.getContext('2d');
                let width = dom.canvasBg.width = window.innerWidth;
                let height = dom.canvasBg.height = window.innerHeight;

                window.addEventListener('resize', () => {
                    width = dom.canvasBg.width = window.innerWidth;
                    height = dom.canvasBg.height = window.innerHeight;
                });

                const particles = Array.from({ length: 45 }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 3 + 1,
                    color: `rgba(34, 197, 94, ${Math.random() * 0.25 + 0.05})`,
                    vx: Math.random() * 0.4 - 0.2,
                    vy: Math.random() * 0.5 + 0.1
                }));

                function drawBg() {
                    ctx.clearRect(0, 0, width, height);
                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y -= p.vy; // Floating upwards
                        if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
                        if (p.x < 0 || p.x > width) p.vx *= -1;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                    });
                    requestAnimationFrame(drawBg);
                }
                drawBg();
            })();

            // --- VALUE ANIMATION HANDLER ---
            function updateCardValue(element, key, newValueStr) {
                if (prevValues[key] !== newValueStr) {
                    element.textContent = newValueStr;
                    prevValues[key] = newValueStr;
                    element.classList.remove('num-animate');
                    void element.offsetWidth; // Force Reflow
                    element.classList.add('num-animate');
                }
            }

            // --- DYNAMIC MOTIVATIONAL MESSAGES ---
            function getMotivationalText(daysRemaining) {
                if (daysRemaining > 60) return "The journey has just begun 🌱";
                if (daysRemaining >= 30) return "Keep going — you're getting closer!";
                if (daysRemaining >= 7) return "The final stretch is here.";
                if (daysRemaining > 0) return "Almost there! 🎉";
                return "The countdown is complete! 🎉";
            }

            function updateMotivationalText(newMsg) {
                if (prevValues.msg !== newMsg) {
                    prevValues.msg = newMsg;
                    dom.motivationalMessage.style.opacity = '0';
                    dom.motivationalMessage.style.transform = 'translateY(6px)';
                    setTimeout(() => {
                        dom.motivationalMessage.textContent = newMsg;
                        dom.motivationalMessage.style.opacity = '1';
                        dom.motivationalMessage.style.transform = 'translateY(0)';
                    }, 300);
                }
            }

            // --- PROGRESS DISPLAY UPDATER ---
            function updateProgressUI(percentage) {
                const formattedPercentage = percentage.toFixed(1);

                // Horizontal Bar Fill
                dom.barFill.style.width = `${percentage}%`;
                dom.barValue.textContent = `${Math.round(percentage)}% completed`;
                dom.progressBarAria.setAttribute('aria-valuenow', formattedPercentage);

                // Circular Stroke Fill
                const offset = CIRCLE_CIRCUMFERENCE - (percentage / 100) * CIRCLE_CIRCUMFERENCE;
                dom.circleProgress.style.strokeDashoffset = offset;
                dom.circlePercentage.textContent = `${Math.round(percentage)}%`;
            }

            // --- CONFETTI & CELEBRATION ENGINE ---
            function triggerCelebration() {
                dom.canvasConfetti.style.display = 'block';
                const ctx = dom.canvasConfetti.getContext('2d');
                let width = dom.canvasConfetti.width = window.innerWidth;
                let height = dom.canvasConfetti.height = window.innerHeight;

                const particles = Array.from({ length: 140 }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height - height,
                    size: Math.random() * 8 + 4,
                    color: ['#16a34a', '#22c55e', '#4ade80', '#86efac', '#bbf7d0', '#ffffff'][Math.floor(Math.random() * 6)],
                    speedY: Math.random() * 3.5 + 2.5,
                    speedX: Math.random() * 2.5 - 1.25,
                    rotation: Math.random() * 360,
                    rotSpeed: Math.random() * 4 - 2
                }));

                function animateConfetti() {
                    ctx.clearRect(0, 0, width, height);
                    particles.forEach(p => {
                        p.y += p.speedY;
                        p.x += p.speedX;
                        p.rotation += p.rotSpeed;

                        if (p.y > height) { p.y = -20; p.x = Math.random() * width; }

                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rotation * Math.PI) / 180);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        ctx.restore();
                    });
                    requestAnimationFrame(animateConfetti);
                }
                animateConfetti();
            }

            // --- MAIN TICK LOOP ---
            function tick() {
                const now = Date.now();
                const remainingTime = TARGET_DATE - now;

                if (remainingTime <= 0) {
                    updateCardValue(dom.days, 'days', '00');
                    updateCardValue(dom.hours, 'hours', '00');
                    updateCardValue(dom.minutes, 'minutes', '00');
                    updateCardValue(dom.seconds, 'seconds', '00');

                    updateProgressUI(100);
                    updateMotivationalText(getMotivationalText(0));

                    dom.completionMessage.style.display = 'block';
                    triggerCelebration();
                    clearInterval(timerInterval);
                    return;
                }

                const days = Math.floor(remainingTime / (1000 * 60 * 60 * 24));
                const hours = Math.floor((remainingTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);

                const elapsedTime = Math.max(0, now - START_DATE);
                const progressPercentage = Math.min(100, (elapsedTime / TOTAL_DURATION) * 100);

                updateCardValue(dom.days, 'days', pad(days));
                updateCardValue(dom.hours, 'hours', pad(hours));
                updateCardValue(dom.minutes, 'minutes', pad(minutes));
                updateCardValue(dom.seconds, 'seconds', pad(seconds));

                updateProgressUI(progressPercentage);
                updateMotivationalText(getMotivationalText(days));
            }

            tick();
            const timerInterval = setInterval(tick, 1000);
        });
    </script>
</body>
</html>
