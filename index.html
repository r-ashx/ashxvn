<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>V-win by A5xi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1f1f1f;
            --panel-bg: #282828;
            --accent-color: #ff0000;
            --accent-hover: #cc0000;
            --text-color: #f1f1f1;
            --text-dim: #9a9a9a;
            --input-bg: #3c3c3c;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            --video-aspect: 9 / 16;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* ============ SECRET CODE GATE ============ */
        #gateOverlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 0, 0, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 80% 85%, rgba(255, 0, 0, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, #161616 0%, #0a0a0a 75%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 1.5rem;
            opacity: 1;
            transition: opacity 0.25s ease;
        }

        #gateOverlay.gate-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .gate-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 2.75rem 2.25rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
            animation: gate-rise 0.45s ease;
        }

        @keyframes gate-rise {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .gate-card.shake {
            animation: gate-shake 0.4s ease;
        }

        @keyframes gate-shake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(4px); }
            30%, 50%, 70% { transform: translateX(-7px); }
            40%, 60% { transform: translateX(7px); }
        }

        .gate-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 1.4rem;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.12);
            border: 1px solid rgba(255, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gate-icon svg {
            width: 22px;
            height: 22px;
            stroke: var(--accent-color);
        }

        .gate-card h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.3px;
        }

        .gate-card p {
            font-size: 0.88rem;
            color: var(--text-dim);
            margin-bottom: 1.75rem;
            line-height: 1.5;
        }

        .gate-input-wrap {
            position: relative;
        }

        .gate-card input {
            width: 100%;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-subtle);
            padding: 0.9rem 2.8rem 0.9rem 1rem;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            letter-spacing: 3px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .gate-card input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.15);
        }

        .gate-toggle-visibility {
            position: absolute;
            right: 0.6rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 0.4rem 0.5rem;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
        }

        .gate-toggle-visibility:hover {
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.06);
        }

        .gate-error {
            color: var(--accent-color);
            font-size: 0.82rem;
            margin-top: 0.75rem;
            min-height: 1.1rem;
            font-weight: 500;
        }

        .gate-submit {
            width: 100%;
            margin-top: 1.4rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .gate-submit:hover {
            background-color: var(--accent-hover);
        }

        .gate-submit:active {
            transform: scale(0.98);
        }

        .gate-footnote {
            margin-top: 1.5rem;
            font-size: 0.72rem;
            color: #666;
            letter-spacing: 0.3px;
        }

        /* ============ MAIN APP ============ */
        #appRoot {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem 6rem;
        }

        #appRoot.unlocked {
            display: flex;
        }

        /* ============ CONTROL PANEL ============ */
        .control-panel {
            background-color: var(--panel-bg);
            padding: 1.75rem;
            border-radius: 18px;
            width: 100%;
            max-width: 800px;
            box-shadow: var(--shadow);
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            border: 1px solid var(--border-subtle);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-dim);
        }

        .segmented {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background-color: var(--input-bg);
            border-radius: 10px;
            padding: 4px;
            gap: 4px;
        }

        .segmented input {
            display: none;
        }

        .segmented label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.7rem 0.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: none;
            letter-spacing: normal;
            color: var(--text-dim);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            user-select: none;
        }

        .segmented input:checked + label {
            background-color: var(--accent-color);
            color: #fff;
        }

        .row-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .stepper-btn {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            background-color: var(--input-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .stepper-btn:hover {
            background-color: #4a4a4a;
        }

        #rowCount {
            flex: 1;
            text-align: center;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-subtle);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
        }

        .row-hint {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .form-group input[type="text"] {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-subtle);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .link-status {
            font-size: 0.75rem;
            color: var(--text-dim);
            min-height: 1rem;
        }

        .link-status.valid {
            color: #4caf50;
        }

        .link-status.invalid {
            color: var(--accent-color);
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 1400px;
        }

        h1::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: var(--accent-color);
            border-radius: 50%;
        }

        .shorts-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 1rem;
            width: 100%;
            max-width: 1400px;
            margin-bottom: 2rem;
        }

        .video-card {
            position: relative;
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid var(--border-subtle);
            width: 100%;
            aspect-ratio: var(--video-aspect);
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(255, 0, 0, 0.15);
            border-color: rgba(255, 0, 0, 0.3);
        }

        .video-card iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
        }

        .empty-state {
            width: 100%;
            max-width: 1400px;
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.9;
            background-color: var(--card-bg);
            border: 1px dashed var(--border-subtle);
            border-radius: 16px;
        }

        .site-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 0.9rem;
            background: linear-gradient(to top, rgba(15,15,15,0.95), rgba(15,15,15,0));
            font-size: 0.85rem;
            color: var(--text-dim);
            letter-spacing: 0.3px;
            z-index: 50;
        }

        .site-footer strong {
            color: var(--text-color);
        }

        @media (max-width: 1100px) {
            .shorts-container { grid-template-columns: repeat(4, 1fr); }
        }

        @media (max-width: 900px) {
            .shorts-container { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 600px) {
            .shorts-container { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
            h1 { font-size: 1.2rem; }
            .control-panel { padding: 1.25rem; }
        }
    </style>
</head>
<body>

    <!-- ============ SECRET CODE GATE ============ -->
    <div id="gateOverlay">
        <div class="gate-card">
            <div class="gate-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="11" width="16" height="10" rx="2"></rect>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                </svg>
            </div>
            <h2>Enter Secret Code</h2>
            <p>This feed generator is private. Enter the access code to continue.</p>
            <div class="gate-input-wrap">
                <input type="password" id="secretCodeInput" placeholder="Secret code" autocomplete="off">
                <button type="button" class="gate-toggle-visibility" id="toggleVisibility" onclick="toggleCodeVisibility()">SHOW</button>
            </div>
            <div class="gate-error" id="gateError"></div>
            <button class="gate-submit" onclick="checkSecretCode()">Unlock</button>
            <div class="gate-footnote">Access is restricted to authorized users only.</div>
        </div>
    </div>

    <!-- ============ MAIN APP ============ -->
    <div id="appRoot">

        <div class="control-panel">
            <div class="form-group">
                <label>Content Type</label>
                <div class="segmented">
                    <input type="radio" name="contentType" id="typeShort" value="short" checked>
                    <label for="typeShort">Short Video</label>
                    <input type="radio" name="contentType" id="typeVideo" value="video">
                    <label for="typeVideo">YouTube Video</label>
                </div>
            </div>

            <div class="form-group">
                <label for="rowCount">Number of Rows (1–8)</label>
                <div class="row-controls">
                    <button type="button" class="stepper-btn" onclick="stepRows(-1)">−</button>
                    <input type="number" id="rowCount" value="2" min="1" max="8" step="1" inputmode="numeric">
                    <button type="button" class="stepper-btn" onclick="stepRows(1)">+</button>
                </div>
                <div class="row-hint">6 videos per row · min 1, max 8 rows</div>
            </div>

            <div class="form-group">
                <label for="youtubeLink">YouTube URL / Share Link</label>
                <input type="text" id="youtubeLink" placeholder="Paste a YouTube link, e.g. https://youtu.be/..." value="" oninput="validateLinkInput()">
                <div class="link-status" id="linkStatus"></div>
            </div>

            <button class="btn-submit" onclick="generateFeed()">Generate Video Feed</button>
        </div>

        <h1 id="feedTitle">Live Viral by A5xi</h1>
        <div class="shorts-container" id="gridContainer"></div>
    </div>

    <div class="site-footer">Powered by <strong>@a5hvnxi</strong></div>

    <script>
        const ACCESS_CODE = "A5vn";

        function toggleCodeVisibility() {
            const input = document.getElementById('secretCodeInput');
            const btn = document.getElementById('toggleVisibility');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'HIDE';
            } else {
                input.type = 'password';
                btn.textContent = 'SHOW';
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            document.getElementById('secretCodeInput').focus();
        });

        function checkSecretCode() {
            const input = document.getElementById('secretCodeInput');
            const error = document.getElementById('gateError');
            if (input.value.trim() === ACCESS_CODE) {
                document.getElementById('gateOverlay').classList.add('gate-hidden');
                setTimeout(() => {
                    document.getElementById('gateOverlay').style.display = 'none';
                }, 250);
                document.getElementById('appRoot').classList.add('unlocked');
                showEmptyState();
            } else {
                const card = document.querySelector('.gate-card');
                card.classList.remove('shake');
                void card.offsetWidth;
                card.classList.add('shake');
                error.textContent = 'Incorrect code. Please try again.';
                input.value = '';
                input.focus();
            }
        }

        document.getElementById('secretCodeInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkSecretCode();
        });

        function stepRows(delta) {
            const rowInput = document.getElementById('rowCount');
            let val = parseInt(rowInput.value, 10) || 1;
            rowInput.value = Math.min(8, Math.max(1, val + delta));
        }

        function extractVideoId(url) {
            if (!url) return null;
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            let match = url.match(regExp);
            if (match && match[2] && match[2].length === 11) return match[2];
            const trimmed = url.trim();
            if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
            return null;
        }

        function validateLinkInput() {
            const rawLink = document.getElementById('youtubeLink').value;
            const status = document.getElementById('linkStatus');
            if (!rawLink.trim()) {
                status.textContent = '';
                status.className = 'link-status';
                return null;
            }
            const id = extractVideoId(rawLink);
            if (id) {
                status.textContent = 'Valid link detected ✓';
                status.className = 'link-status valid';
            } else {
                status.textContent = 'This doesn\'t look like a valid YouTube link';
                status.className = 'link-status invalid';
            }
            return id;
        }

        const DEFAULT_VIDEO_ID = 'mngEMrg9wOQ';
        const COLUMNS_PER_ROW = 6;

        function showEmptyState() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '<div class="empty-state">📺<br>No videos loaded yet.<br>Choose your options above and click <strong>Generate Video Feed</strong>.</div>';
        }

        function generateFeed() {
            const rawLink = document.getElementById('youtubeLink').value;
            const container = document.getElementById('gridContainer');

            let videoId = DEFAULT_VIDEO_ID;
            if (rawLink.trim()) {
                const validId = extractVideoId(rawLink);
                if (validId) videoId = validId;
            }

            const contentType = document.querySelector('input[name="contentType"]:checked').value;
            let rowCount = parseInt(document.getElementById('rowCount').value, 10) || 1;
            rowCount = Math.min(8, Math.max(1, rowCount));

            if (contentType === 'short') {
                document.documentElement.style.setProperty('--video-aspect', '9 / 16');
                document.getElementById('feedTitle').innerText = "Live Viral by A5xi";
            } else {
                document.documentElement.style.setProperty('--video-aspect', '16 / 9');
                document.getElementById('feedTitle').innerText = "Live Viral by A5xi";
            }

            container.innerHTML = '';
            const totalElementsNeeded = rowCount * COLUMNS_PER_ROW;

            for (let i = 0; i < totalElementsNeeded; i++) {
                const card = document.createElement('div');
                card.className = 'video-card';

                const iframe = document.createElement('iframe');
                // Clean standard embed URL with autoplay, mute, and looping parameters
                iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&playsinline=1&controls=1&rel=0`;
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                iframe.allowFullscreen = true;

                card.appendChild(iframe);
                container.appendChild(card);
            }
        }
    </script>
</body>
</html>
