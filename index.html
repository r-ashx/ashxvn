<html lang="en">
<head>

  <!-- Google Fonts: Inter for clean professional text & Rajdhani / Space Grotesk for bold modern headings -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       RESET & CORE STYLES
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary-red: #ff2a5f;
      --dark-red: #c20038;
      --bg-dark: #04060a;
      --card-bg: rgba(12, 16, 24, 0.85);
      --card-border: rgba(255, 42, 95, 0.28);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Advanced Interactive Animated Canvas Background */
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Ambient Glow Accents */
    .ambient-glow {
      position: absolute;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 42, 95, 0.14) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 1;
      filter: blur(60px);
    }
    .glow-1 { top: -220px; left: -220px; animation: pulseGlow 9s ease-in-out infinite alternate; }
    .glow-2 { bottom: -220px; right: -220px; animation: pulseGlow 9s ease-in-out infinite alternate-reverse; }

    @keyframes pulseGlow {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.25); opacity: 0.95; }
    }

    /* Security Alarm Flash Overlay */
    #alert-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 0, 60, 0.45) 0%, rgba(0, 0, 0, 0) 90%);
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .flashing-active {
      animation: flashWarning 0.6s infinite alternate;
    }

    @keyframes flashWarning {
      0% { opacity: 0.15; }
      100% { opacity: 0.95; }
    }

    /* ==========================================================================
       CARD CONTAINER & GLASSMORPHISM
       ========================================================================== */
    .perspective-container {
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    .auth-card {
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 28px;
      padding: 40px 32px;
      text-align: center;
      border: 1px solid var(--card-border);
      box-shadow: 
        0 30px 70px rgba(0, 0, 0, 0.75),
        0 0 35px rgba(255, 42, 95, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .shake {
      animation: shakeCard 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shakeCard {
      10%, 90% { transform: translate3d(-4px, 0, 0); }
      20%, 80% { transform: translate3d(6px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
      40%, 60% { transform: translate3d(8px, 0, 0); }
    }

    /* Header Icon */
    .icon-container {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      background: linear-gradient(135deg, rgba(255, 42, 95, 0.16), rgba(12, 16, 24, 0.9));
      border: 1.5px solid rgba(255, 42, 95, 0.4);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 42, 95, 0.2);
      transition: all 0.3s ease;
    }

    .icon-container svg {
      width: 30px;
      height: 30px;
      fill: none;
      stroke: var(--primary-red);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(255, 42, 95, 0.5));
    }

    /* Typography restored & polished */
    h1.title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 28px;
      font-weight: 600;
    }

    /* Inputs (Digit Boxes) */
    .digit-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 22px;
      width: 100%;
    }

    .digit-box {
      width: 54px;
      height: 64px;
      background: rgba(2, 4, 8, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      outline: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      caret-color: var(--primary-red);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .digit-box:focus {
      border-color: var(--primary-red);
      background: rgba(255, 42, 95, 0.08);
      box-shadow: 0 0 18px rgba(255, 42, 95, 0.4), inset 0 2px 6px rgba(0, 0, 0, 0.6);
      transform: translateY(-2px);
    }

    .input-error {
      border-color: var(--primary-red) !important;
      background-color: rgba(255, 0, 60, 0.12) !important;
    }

    /* Buttons */
    .verify-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%);
      border: none;
      border-radius: 14px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px rgba(255, 42, 95, 0.35);
    }

    .verify-btn:hover:not(:disabled) {
      box-shadow: 0 14px 30px rgba(255, 42, 95, 0.5);
      transform: translateY(-2px);
    }

    .verify-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .verify-btn:disabled {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Status Messages & Trackers */
    .status-message {
      min-height: 24px;
      margin-top: 16px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-message.error { color: #ff3366; }
    .status-message.success { color: #00f576; text-shadow: 0 0 10px rgba(0, 245, 118, 0.4); }

    .attempts-tracker {
      margin-top: 10px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 1.2px;
    }

    .attempts-tracker span {
      color: var(--primary-red);
      font-family: 'JetBrains Mono', monospace;
    }

    .timer-display {
      color: var(--primary-red);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.82rem;
      margin-top: 10px;
      display: none;
      letter-spacing: 1px;
    }

    /* ==========================================================================
       AUTHENTICATED LINKS SECTION (CLEAN & ATTRACTIVE CARDS)
       ========================================================================== */
    #links-container {
      display: none;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 10px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Custom Scrollbar for Links */
    #links-container::-webkit-scrollbar {
      width: 5px;
    }
    #links-container::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
    }
    #links-container::-webkit-scrollbar-thumb {
      background: rgba(255, 42, 95, 0.4);
      border-radius: 10px;
    }
    #links-container::-webkit-scrollbar-thumb:hover {
      background: var(--primary-red);
    }

    #links-container.show {
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 1;
      transform: translateY(0);
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 15px 20px;
      background: rgba(18, 24, 33, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      letter-spacing: 0.5px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: var(--primary-red);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .link-btn:hover {
      border-color: rgba(255, 42, 95, 0.6);
      background: rgba(255, 42, 95, 0.1);
      color: #ffffff;
      box-shadow: 0 8px 25px rgba(255, 42, 95, 0.28);
      transform: translateY(-2px);
    }

    .link-btn:hover::before {
      opacity: 1;
    }

    .link-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .link-icon-box {
      width: 34px;
      height: 34px;
      background: rgba(255, 42, 95, 0.12);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .link-icon-box svg {
      width: 17px;
      height: 17px;
      stroke: var(--primary-red);
      stroke-width: 2;
      fill: none;
    }

    .link-btn .arrow-icon {
      width: 18px;
      height: 18px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
      transition: all 0.2s ease;
    }

    .link-btn:hover .arrow-icon {
      stroke: var(--primary-red);
      transform: translateX(4px);
    }

    /* Badge for Coming Soon links */
    .badge-soon {
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      background: rgba(255, 193, 7, 0.15);
      color: #ffc107;
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid rgba(255, 193, 7, 0.35);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .link-btn.disabled-link {
      opacity: 0.75;
      cursor: default;
    }
    .link-btn.disabled-link:hover {
      border-color: rgba(255, 255, 255, 0.08);
      background: rgba(18, 24, 33, 0.75);
      transform: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .link-btn.disabled-link:hover::before {
      opacity: 0;
    }
    .link-btn.disabled-link:hover .arrow-icon {
      stroke: var(--text-muted);
      transform: none;
    }
  </style>
</head>

  <script>
    /* ==========================================================================
       ADVANCED DYNAMIC BACKGROUND CANVAS ANIMATION
       ========================================================================== */
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particlesArray = [];
    const numberOfParticles = Math.min(window.innerWidth > 768 ? 75 : 35, 90);

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 1.2;
        this.vy = (Math.random() - 0.5) * 1.2;
        this.size = Math.random() * 2.2 + 0.8;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
        if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
      }
      draw() {
        ctx.fillStyle = 'rgba(255, 42, 95, 0.7)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < numberOfParticles; i++) {
      particlesArray.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw subtle grid overlay
      ctx.strokeStyle = 'rgba(255, 42, 95, 0.03)';
      ctx.lineWidth = 1;
      const gridSize = 60;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Update and connect particles
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
        particlesArray[i].draw();

        for (let j = i + 1; j < particlesArray.length; j++) {
          const dx = particlesArray[i].x - particlesArray[j].x;
          const dy = particlesArray[i].y - particlesArray[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 130) {
            ctx.strokeStyle = `rgba(255, 42, 95, ${0.22 * (1 - distance / 130)})`;
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
            ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();


    /* ==========================================================================
       AUTHENTICATION & SECURITY LOGIC
       ========================================================================== */
    const CONFIG = {
      SECRET_CODE: "@5hx",
      MAX_ATTEMPTS: 3,
      LOCKOUT_DURATION: 10
    };

    let attempts = 0;
    let isLocked = false;
    let lockoutTimer = null;

    const card = document.getElementById('card');
    const inputs = Array.from(document.querySelectorAll('.digit-box'));
    const verifyBtn = document.getElementById('verify-btn');
    const statusMsg = document.getElementById('status-message');
    const attemptsLeftDisplay = document.getElementById('attempts-left');
    const timerDisplay = document.getElementById('timer-display');
    const timerCountDisplay = document.getElementById('timer-count');
    const alertOverlay = document.getElementById('alert-overlay');
    const alertAudio = document.getElementById('alert-audio');
    const lockIcon = document.getElementById('lock-icon');
    const authSection = document.getElementById('auth-section');
    const linksContainer = document.getElementById('links-container');
    const mainTitle = document.getElementById('main-title');
    const mainSubtitle = document.getElementById('main-subtitle');
    const iconBox = document.getElementById('icon-box');

    /* Input Handling */
    inputs[0].focus();

    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
        checkAutoSubmit();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace') {
          if (input.value === '' && index > 0) {
            inputs[index - 1].focus();
            inputs[index - 1].value = '';
          } else {
            input.value = '';
          }
        } else if (e.key === 'ArrowLeft' && index > 0) {
          inputs[index - 1].focus();
        } else if (e.key === 'ArrowRight' && index < inputs.length - 1) {
          inputs[index + 1].focus();
        } else if (e.key === 'Enter') {
          handleVerification();
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim();
        if (pasteData.length === 4) {
          pasteData.split('').forEach((char, i) => {
            if (inputs[i]) inputs[i].value = char;
          });
          inputs[3].focus();
          checkAutoSubmit();
        }
      });
    });

    function getEnteredCode() {
      return inputs.map(i => i.value).join('');
    }

    function checkAutoSubmit() {
      if (getEnteredCode().length === 4) {
        handleVerification();
      }
    }

    function clearInputs() {
      inputs.forEach(i => i.value = '');
      if (!isLocked) inputs[0].focus();
    }

    verifyBtn.addEventListener('click', handleVerification);

    /* Verification Logic */
    function handleVerification() {
      if (isLocked) return;

      const code = getEnteredCode();

      if (code.length < 4) {
        showStatus("ENTER FULL 4-CHARACTER CODE", "error");
        triggerErrorAnimation();
        return;
      }

      if (code === CONFIG.SECRET_CODE) {
        processSuccess();
      } else {
        processFailure();
      }
    }

    function processSuccess() {
      showStatus("ACCESS GRANTED", "success");
      
      card.style.borderColor = "rgba(0, 245, 118, 0.5)";
      card.style.boxShadow = "0 30px 70px rgba(0, 0, 0, 0.75), 0 0 40px rgba(0, 245, 118, 0.22)";

      lockIcon.innerHTML = `
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V4a5 5 0 0 1 9.9-1"></path>
      `;
      lockIcon.style.stroke = "#00f576";
      iconBox.style.borderColor = "rgba(0, 245, 118, 0.5)";
      iconBox.style.background = "linear-gradient(135deg, rgba(0, 245, 118, 0.18), rgba(12, 16, 24, 0.9))";

      setTimeout(() => {
        authSection.style.display = 'none';
        mainTitle.innerText = "Dashboard Links";
        mainSubtitle.innerText = "Select an option below";
        linksContainer.classList.add('show');
      }, 600);
    }

    function processFailure() {
      attempts++;
      attemptsLeftDisplay.innerText = CONFIG.MAX_ATTEMPTS - attempts;

      showStatus("You are not Authorized Person!!", "error");
      triggerErrorAnimation();
      clearInputs();

      if (attempts >= CONFIG.MAX_ATTEMPTS) {
        triggerLockout();
      }
    }

    function triggerErrorAnimation() {
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');

      inputs.forEach(i => {
        i.classList.add('input-error');
        setTimeout(() => i.classList.remove('input-error'), 1000);
      });
    }

    function showStatus(text, type) {
      statusMsg.innerText = text;
      statusMsg.className = `status-message ${type}`;
    }

    function triggerLockout() {
      isLocked = true;
      verifyBtn.disabled = true;
      inputs.forEach(i => i.disabled = true);

      playAlertAudio();
      alertOverlay.classList.add('flashing-active');

      timerDisplay.style.display = 'block';
      let timeLeft = CONFIG.LOCKOUT_DURATION;
      timerCountDisplay.innerText = timeLeft;

      lockoutTimer = setInterval(() => {
        timeLeft--;
        timerCountDisplay.innerText = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(lockoutTimer);
          resetLockout();
        }
      }, 1000);
    }

    function resetLockout() {
      isLocked = false;
      attempts = 0;
      attemptsLeftDisplay.innerText = CONFIG.MAX_ATTEMPTS;
      verifyBtn.disabled = false;
      inputs.forEach(i => i.disabled = false);

      alertOverlay.classList.remove('flashing-active');
      timerDisplay.style.display = 'none';
      showStatus("", "");
      inputs[0].focus();
    }

    function playAlertAudio() {
      const playPromise = alertAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => synthesizeAlarmSound());
      }
    }

    function synthesizeAlarmSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        for (let i = 0; i < 3; i++) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(880, ctx.currentTime + i * 0.3);
          osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + i * 0.3 + 0.25);

          gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.3);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.3 + 0.25);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(ctx.currentTime + i * 0.3);
          osc.stop(ctx.currentTime + i * 0.3 + 0.25);
        }
      } catch (e) {
        console.warn("Audio synthesis unavailable.");
      }
    }
  </script>
</body>
