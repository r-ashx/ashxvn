<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ashx - Access Portal</title>
  <style>
    /* ==========================================================================
       RESET & CORE STYLES
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary-red: #ff0000;
      --dark-red: #b30000;
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-border: rgba(255, 0, 0, 0.3);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #f8f9fa;
      color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Clean subtle background grid */
    .bg-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
      z-index: 1;
      pointer-events: none;
    }

    .bg-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 0, 0, 0.12) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }

    #alert-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 0, 0, 0.35) 0%, rgba(255, 255, 255, 0) 100%);
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .flashing-active {
      animation: flashWarning 0.8s infinite alternate;
    }

    @keyframes flashWarning {
      0% { opacity: 0.1; }
      100% { opacity: 0.85; }
    }

    /* ==========================================================================
       CONTAINER & CLEAN CARD (NO UNNECESSARY FLOATING)
       ========================================================================== */
    .perspective-container {
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    .auth-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 35px 28px;
      text-align: center;
      border: 1.5px solid var(--card-border);
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.06),
        0 0 25px rgba(255, 0, 0, 0.15);
      transition: all 0.3s ease;
      position: relative;
    }

    .shake {
      animation: shakeCard 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shakeCard {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    /* Header Icon */
    .icon-container {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      background: #ffffff;
      border: 1.5px solid rgba(255, 0, 0, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05), 0 0 15px rgba(255, 0, 0, 0.15);
      transition: all 0.3s ease;
    }

    .icon-container svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1.title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #000000;
      margin-bottom: 4px;
    }

    p.subtitle {
      font-size: 0.8rem;
      color: rgba(0, 0, 0, 0.55);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 24px;
      font-weight: 600;
    }

    /* Inputs */
    .digit-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
    }

    .digit-box {
      width: 50px;
      height: 58px;
      background: #ffffff;
      border: 1.5px solid rgba(0, 0, 0, 0.15);
      border-radius: 12px;
      font-size: 1.5rem;
      font-weight: 700;
      color: #000000;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
      caret-color: var(--primary-red);
    }

    .digit-box:focus {
      border-color: var(--primary-red);
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.3);
    }

    .input-error {
      border-color: var(--primary-red) !important;
      background-color: rgba(255, 0, 0, 0.03);
    }

    /* Buttons */
    .verify-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 8px 18px rgba(255, 0, 0, 0.25);
    }

    .verify-btn:hover:not(:disabled) {
      box-shadow: 0 10px 22px rgba(255, 0, 0, 0.35);
      transform: translateY(-1px);
    }

    .verify-btn:disabled {
      background: #e0e0e0;
      color: #999999;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Status Messages */
    .status-message {
      min-height: 22px;
      margin-top: 16px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .status-message.error { color: #d30000; }
    .status-message.success { color: #008000; }

    .attempts-tracker {
      margin-top: 10px;
      font-size: 0.72rem;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.4);
      letter-spacing: 1px;
    }

    .timer-display {
      color: var(--primary-red);
      font-weight: 700;
      font-size: 0.8rem;
      margin-top: 8px;
      display: none;
    }

    /* ==========================================================================
       AUTHENTICATED LINKS SECTION (CLEAN & MODERN BUTTONS)
       ========================================================================== */
    #links-container {
      display: none;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
      margin-top: 10px;
    }

    #links-container.show {
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 1;
      transform: translateY(0);
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 14px 20px;
      background: #ffffff;
      border: 1.5px solid rgba(0, 0, 0, 0.08);
      border-radius: 14px;
      color: #111111;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
    }

    .link-btn:hover {
      border-color: var(--primary-red);
      background: rgba(255, 0, 0, 0.02);
      color: var(--primary-red);
      box-shadow: 0 6px 16px rgba(255, 0, 0, 0.15);
      transform: translateY(-2px);
    }

    .link-btn .arrow-icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      transition: transform 0.2s ease;
    }

    .link-btn:hover .arrow-icon {
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <!-- Clean Background -->
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <!-- Security Flash Overlay -->
  <div id="alert-overlay"></div>

  <!-- Main Card -->
  <div class="perspective-container">
    <div class="auth-card" id="card">
      
      <!-- Lock Header -->
      <div class="icon-container" id="icon-box">
        <svg id="lock-icon" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1 class="title" id="main-title">Ash X Authentication</h1>
      <p class="subtitle" id="main-subtitle">Enter Secret Code</p>

      <!-- Code Form Section -->
      <div id="auth-section">
        <div class="digit-container">
          <input type="text" class="digit-box" maxlength="1" autocomplete="off" inputmode="text" autofocus>
          <input type="text" class="digit-box" maxlength="1" autocomplete="off" inputmode="text">
          <input type="text" class="digit-box" maxlength="1" autocomplete="off" inputmode="text">
          <input type="text" class="digit-box" maxlength="1" autocomplete="off" inputmode="text">
        </div>

        <button class="verify-btn" id="verify-btn">VERIFY</button>

        <div class="status-message" id="status-message"></div>
        <div class="attempts-tracker" id="attempts-tracker">ATTEMPTS LEFT: <span id="attempts-left">3</span></div>
        <div class="timer-display" id="timer-display">SYSTEM LOCKED: <span id="timer-count">10</span>s</div>
      </div>

      <!-- Links Container (Revealed after success) -->
      <div id="links-container">
        <a href="https://ashx-eight.vercel.app/" target="_blank" class="link-btn">
          <span>Portfolio</span>
          <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a href="https://ashxvn.vercel.app/4u/Learning.html" target="_blank" class="link-btn">
          <span>Learning</span>
          <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a href="https://ashxvn.vercel.app/4u/YTPlay.html" target="_blank" class="link-btn">
          <span>YT Player</span>
          <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a href="https://ashxvn.vercel.app/4u/Watch.html" target="_blank" class="link-btn">
          <span>Watch</span>
          <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a href="https://ashxvn.vercel.app/4u/more.html" target="_blank" class="link-btn">
          <span>More</span>
          <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a href="https://ashxvn.vercel.app/4u/YTPlay.html" target="_blank" class="link-btn">
          <span>Learning</span>
          <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>

    </div>
  </div>

  <audio id="alert-audio" preload="auto">
    <source src="Alerttt.mp3" type="audio/mpeg">
  </audio>

  <script>
    const CONFIG = {
      SECRET_CODE: "@5hx",
      MAX_ATTEMPTS: 3,
      LOCKOUT_DURATION: 10
    };

    let attempts = 0;
    let isLocked = false;
    let lockoutTimer = null;

    const card = document.getElementById('card');
    const inputs = Array.from(document.querySelectorAll('.digit-box'));
    const verifyBtn = document.getElementById('verify-btn');
    const statusMsg = document.getElementById('status-message');
    const attemptsLeftDisplay = document.getElementById('attempts-left');
    const timerDisplay = document.getElementById('timer-display');
    const timerCountDisplay = document.getElementById('timer-count');
    const alertOverlay = document.getElementById('alert-overlay');
    const alertAudio = document.getElementById('alert-audio');
    const lockIcon = document.getElementById('lock-icon');
    const authSection = document.getElementById('auth-section');
    const linksContainer = document.getElementById('links-container');
    const mainTitle = document.getElementById('main-title');
    const mainSubtitle = document.getElementById('main-subtitle');
    const iconBox = document.getElementById('icon-box');

    /* Input Handling */
    inputs[0].focus();

    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
        checkAutoSubmit();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace') {
          if (input.value === '' && index > 0) {
            inputs[index - 1].focus();
            inputs[index - 1].value = '';
          } else {
            input.value = '';
          }
        } else if (e.key === 'ArrowLeft' && index > 0) {
          inputs[index - 1].focus();
        } else if (e.key === 'ArrowRight' && index < inputs.length - 1) {
          inputs[index + 1].focus();
        } else if (e.key === 'Enter') {
          handleVerification();
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim();
        if (pasteData.length === 4) {
          pasteData.split('').forEach((char, i) => {
            if (inputs[i]) inputs[i].value = char;
          });
          inputs[3].focus();
          checkAutoSubmit();
        }
      });
    });

    function getEnteredCode() {
      return inputs.map(i => i.value).join('');
    }

    function checkAutoSubmit() {
      if (getEnteredCode().length === 4) {
        handleVerification();
      }
    }

    function clearInputs() {
      inputs.forEach(i => i.value = '');
      if (!isLocked) inputs[0].focus();
    }

    verifyBtn.addEventListener('click', handleVerification);

    /* Verification Logic */
    function handleVerification() {
      if (isLocked) return;

      const code = getEnteredCode();

      if (code.length < 4) {
        showStatus("ENTER FULL 4-CHARACTER CODE", "error");
        triggerErrorAnimation();
        return;
      }

      if (code === CONFIG.SECRET_CODE) {
        processSuccess();
      } else {
        processFailure();
      }
    }

    function processSuccess() {
      showStatus("ACCESS GRANTED", "success");
      
      card.style.borderColor = "#008000";
      card.style.boxShadow = "0 15px 35px rgba(0, 128, 0, 0.15)";

      lockIcon.innerHTML = `
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V4a5 5 0 0 1 9.9-1"></path>
      `;
      lockIcon.style.stroke = "#008000";
      iconBox.style.borderColor = "#008000";

      setTimeout(() => {
        authSection.style.display = 'none';
        mainTitle.innerText = "Dashboard Links";
        mainSubtitle.innerText = "Select an option below";
        linksContainer.classList.add('show');
      }, 600);
    }

    function processFailure() {
      attempts++;
      attemptsLeftDisplay.innerText = CONFIG.MAX_ATTEMPTS - attempts;

      showStatus("You are not Authorized Person!!", "error");
      triggerErrorAnimation();
      clearInputs();

      if (attempts >= CONFIG.MAX_ATTEMPTS) {
        triggerLockout();
      }
    }

    function triggerErrorAnimation() {
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');

      inputs.forEach(i => {
        i.classList.add('input-error');
        setTimeout(() => i.classList.remove('input-error'), 1000);
      });
    }

    function showStatus(text, type) {
      statusMsg.innerText = text;
      statusMsg.className = `status-message ${type}`;
    }

    function triggerLockout() {
      isLocked = true;
      verifyBtn.disabled = true;
      inputs.forEach(i => i.disabled = true);

      playAlertAudio();
      alertOverlay.classList.add('flashing-active');

      timerDisplay.style.display = 'block';
      let timeLeft = CONFIG.LOCKOUT_DURATION;
      timerCountDisplay.innerText = timeLeft;

      lockoutTimer = setInterval(() => {
        timeLeft--;
        timerCountDisplay.innerText = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(lockoutTimer);
          resetLockout();
        }
      }, 1000);
    }

    function resetLockout() {
      isLocked = false;
      attempts = 0;
      attemptsLeftDisplay.innerText = CONFIG.MAX_ATTEMPTS;
      verifyBtn.disabled = false;
      inputs.forEach(i => i.disabled = false);

      alertOverlay.classList.remove('flashing-active');
      timerDisplay.style.display = 'none';
      showStatus("", "");
      inputs[0].focus();
    }

    function playAlertAudio() {
      const playPromise = alertAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => synthesizeAlarmSound());
      }
    }

    function synthesizeAlarmSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        for (let i = 0; i < 3; i++) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(880, ctx.currentTime + i * 0.3);
          osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + i * 0.3 + 0.25);

          gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.3);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.3 + 0.25);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(ctx.currentTime + i * 0.3);
          osc.stop(ctx.currentTime + i * 0.3 + 0.25);
        }
      } catch (e) {
        console.warn("Audio synthesis unavailable.");
      }
    }
  </script>
</body>
</html>
