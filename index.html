<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Video Showcase</title>
    <!-- Modern Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. RESET & AMBIENT BACKGROUND
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
            overflow-x: hidden;
        }

        .ambient-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(108, 92, 231, 0.25) 0%, rgba(255, 118, 117, 0.15) 50%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
            filter: blur(60px);
        }

        /* ==========================================================================
           2. SHOWCASE CONTAINER
           ========================================================================== */
        .showcase-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            animation: heroFadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .header-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .logo {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.08);
            padding: 5px 14px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .heading {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.2;
            background: linear-gradient(135deg, #ffffff 0%, #d2d2d5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .heading span {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.85rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
        }

        /* ==========================================================================
           3. VIDEO CARD STYLES
           ========================================================================== */
        .video-card {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            border-radius: 24px;
            overflow: hidden;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .fg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            visibility: hidden;
            z-index: 1;
            transition: opacity 0.6s ease-in-out, visibility 0.6s ease-in-out;
        }

        .fg-video.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0) 100%);
            pointer-events: none;
            z-index: 3;
        }

        /* Navigation Arrows (Left & Right) */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            user-select: none;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-prev { left: 12px; }
        .nav-next { right: 12px; }

        /* Bottom Controls Overlay */
        .controls-overlay {
            position: absolute;
            bottom: 18px;
            left: 0;
            width: 100%;
            z-index: 4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .dots-indicator {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .dot.active {
            width: 26px;
            border-radius: 10px;
            background: #ffffff;
        }

        .media-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: transform 0.2s ease;
        }

        .media-btn:hover {
            transform: scale(1.1);
        }

        .cta-button {
            width: 100%;
            padding: 14px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #6C5CE7 0%, #8E44AD 50%, #FF7675 100%);
            background-size: 200% auto;
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.4);
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .cta-button:hover {
            background-position: right center;
            transform: translateY(-2px);
        }

        @keyframes heroFadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <div class="showcase-container">
        <div class="header-content">
            <div class="logo">AURA STUDIO</div>
            <h1 class="heading">Featured <span>Visuals</span></h1>
            <p class="subtitle">Use buttons or dots to switch videos</p>
        </div>

        <div class="video-card">
            <!-- Next & Previous Buttons -->
            <button class="nav-btn nav-prev" onclick="prevVideo()">❮</button>
            <button class="nav-btn nav-next" onclick="nextVideo()">❯</button>

            <!-- Video Elements (Only manual control) -->
            <video class="fg-video active" muted playsinline loop id="vid0">
                <source src="BWMxAPS.mp4" type="video/mp4">
            </video>
            <video class="fg-video" muted playsinline loop id="vid1">
                <source src="DelhiQwali.mp4" type="video/mp4">
            </video>

            <div class="card-overlay"></div>

            <div class="controls-overlay">
                <!-- Dots for direct video selection -->
                <div class="dots-indicator">
                    <div class="dot active" onclick="goToVideo(0)"></div>
                    <div class="dot" onclick="goToVideo(1)"></div>
                    <div class="dot" onclick="goToVideo(2)"></div>
                </div>

                <button class="media-btn" id="muteBtn" onclick="toggleMute()">🔇</button>
            </div>
        </div>

        <a href="#explore" class="cta-button">Explore Collection</a>
    </div>

    <!-- PURE MANUAL CONTROL SCRIPT -->
    <script>
        const videos = document.querySelectorAll('.fg-video');
        const dots = document.querySelectorAll('.dot');
        const muteBtn = document.getElementById('muteBtn');
        
        let currentIndex = 0;
        let isMuted = true;

        // Function to switch to a specified video
        function goToVideo(index) {
            // Remove active status from current
            videos[currentIndex].classList.remove('active');
            videos[currentIndex].pause();
            dots[currentIndex].classList.remove('active');

            // Set new active index
            currentIndex = index;

            // Update & play new video
            const activeVid = videos[currentIndex];
            activeVid.muted = isMuted;
            activeVid.currentTime = 0;
            activeVid.classList.add('active');
            dots[currentIndex].classList.add('active');

            activeVid.play().catch(err => console.log("Playback error:", err));
        }

        // Button handlers
        function nextVideo() {
            let nextIndex = (currentIndex + 1) % videos.length;
            goToVideo(nextIndex);
        }

        function prevVideo() {
            let prevIndex = (currentIndex - 1 + videos.length) % videos.length;
            goToVideo(prevIndex);
        }

        function toggleMute() {
            isMuted = !isMuted;
            videos.forEach(v => v.muted = isMuted);
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
        }

        // Initial setup on load (Plays video #1 and waits for user input)
        document.addEventListener('DOMContentLoaded', () => {
            videos[0].play().catch(err => console.log("Waiting for user interaction", err));
        });
    </script>
</body>
</html>
